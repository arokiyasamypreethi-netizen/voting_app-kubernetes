apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote
  labels:
    app: vote
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voting-app
  template:
    metadata:
      name : voting-app
      labels:
        app: voting-app
    spec:
      containers:
        - name: vote
          image: dockersamples/examplevotingapp_vote
  
    
    