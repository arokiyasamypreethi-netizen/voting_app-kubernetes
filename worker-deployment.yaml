apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-app
  template:
    metadata:
      name : worker-app
      labels:
        app: worker-app
    spec:
      containers:
        - name: worker
          image: dockersamples/examplevotingapp_worker
  
    
    