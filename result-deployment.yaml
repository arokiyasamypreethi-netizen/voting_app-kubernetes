apiVersion: apps/v1
kind: Deployment
metadata:
  name: result
  labels:
    app: result
spec:
  replicas: 1
  selector:
    matchLabels:
      app: result-app
  template:
    metadata:
      name : result-app
      labels:
        app: result-app
    spec:
      containers:
        - name: result
          image: dockersamples/examplevotingapp_result
  
    
    